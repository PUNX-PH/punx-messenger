name = "punx-messenger"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Custom domain for the app.
#
# Declared here rather than only clicked into the dashboard so the domain lives
# in version control with everything else. `custom_domain = true` makes
# Cloudflare create the DNS record and issue the certificate itself — the zone
# punxai.online is already on Cloudflare (ns: bryce/jill.ns.cloudflare.com), so
# there is no ownership TXT and no CNAME to add by hand. That verification dance
# belongs to hosts that do not control the zone.
#
# It resolves over HTTPS once issued, which matters: browsers only permit
# getUserMedia/getDisplayMedia on a secure origin, so voice and screen share
# would not work at all over plain http.
[[routes]]
pattern = "plexus.punxai.online"
custom_domain = true
