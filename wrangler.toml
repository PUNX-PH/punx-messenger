name = "punx-messenger"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# NO custom domain declared here, and that is deliberate until the zone moves.
#
# `custom_domain = true` for plexus.punxai.online failed every deploy with:
#   Could not find zone for `plexus.punxai.online`.
# A Workers custom domain requires the zone to be in the SAME Cloudflare
# account as the Worker. punxai.online's nameservers are Cloudflare's
# (bryce/jill.ns.cloudflare.com), but that only proves Cloudflare hosts the
# zone somewhere -- NS records do not say which account holds it, and this
# account (rey@punx.ai) has none for it.
#
# Leaving the declaration in place broke both the Git build and manual deploys,
# since the route is applied on every deploy. Re-add it once punxai.online is a
# zone in this account:
#
#   [[routes]]
#   pattern = "plexus.punxai.online"
#   custom_domain = true
