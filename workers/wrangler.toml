name = "punx-messenger-gifs"
main = "src/index.js"
compatibility_date = "2024-11-01"

# ── KV (JWKS cache for Firebase ID token verification) ──
# Gates the GIF proxy routes against random internet traffic — nothing else
# lives in this Worker. Firestore is the real backend; see the main repo.
[[kv_namespaces]]
binding = "JWKS_CACHE"
id = "681bf145d9ab4199b60e8a47fa38999b"

# ── Auth / domain allowlist ──
# KEEP IN SYNC with the matching VITE_* vars in .env.local / firestore.rules.
[vars]
FIREBASE_PROJECT_ID = "punx-msg"

# Cloudflare TURN. The ID is not a secret; the token that goes with it is, and
# lives as a Worker secret (`wrangler secret put TURN_KEY_API_TOKEN`) exactly
# like KLIPY_API_KEY. Without BOTH set, /turn/credentials returns 503 and the
# clients fall back to STUN-only — the behaviour they had before.
TURN_KEY_ID = "ae9b92196ded56734e03dfab7ee3b9fe"
ALLOWED_EMAIL_DOMAIN = "punx.ai"
ALLOWED_EXTRA_EMAILS = "perezjohnrey43@gmail.com"

# ── CORS allowlist — add any new deploy origin (custom domain, etc.) here ──
ALLOWED_ORIGINS = "http://localhost:5173,https://punx-messenger.vercel.app,https://punx-messenger.rey-433.workers.dev,http://plexus.punxai.online,https://plexus.punxai.online"

# ── Klipy (GIF picker) — SECRET, not a var. Local dev reads it from
# workers/.dev.vars (gitignored). On deploy: `wrangler secret put KLIPY_API_KEY`.
# env.KLIPY_API_KEY
