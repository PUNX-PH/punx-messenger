<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/logo-punx.png" />
    <title>Punx Messenger</title>
    <script>
    // Inline and synchronous, deliberately: this has to run before the first
    // paint or someone with a light theme or their own colours sees the default
    // ones flash on every load. Wrapped because localStorage throws outright in
    // some privacy modes.
    //
    // It applies the snapshot of the saved preferences that the app itself stores
    // (src/lib/prefsStore.js), and must do exactly what applySnapshot() in
    // src/lib/prefs.js does; tests/prefs.test.mjs runs this very script and holds
    // it to that. With no snapshot it falls back to the old light/dark switch.
    try {
      var root = document.documentElement
      var snap = null
      try { snap = JSON.parse(localStorage.getItem('punx.prefsCss')) } catch (e) {}
      if (snap && typeof snap === 'object' && snap.vars && typeof snap.vars === 'object') {
        var light = snap.theme === 'light' ||
          (snap.theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
        root.classList.toggle('light', !!light)
        var vars = snap.vars[light ? 'light' : 'dark'] || {}
        for (var name in vars) root.style.setProperty(name, vars[name])
        if (snap.fontStack) root.style.setProperty('--font-body', snap.fontStack)
        if (snap.fontSize) root.style.setProperty('font-size', snap.fontSize)
        if (snap.density) root.dataset.density = snap.density
        if (snap.motion) root.dataset.motion = snap.motion
      } else if (localStorage.getItem('themeMode') === 'light') {
        root.classList.add('light')
      }
    } catch (e) {}
  </script>
</head>
  <body class="bg-bg-main text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
